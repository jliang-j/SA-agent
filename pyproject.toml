[project]
name = "sa-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JL", email = "by335707@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.24",
    "dotenv>=0.9.9",
    "fastapi>=0.143.1",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sa-agent = "sa_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
